name: SonarQube

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to analyze"
        required: true
        default: master

jobs:
  sonar:
    runs-on: debian13
    env:
      CC: clang
      CXX: clang++
      EZLIBS_CMAKE_ARGS: >-
        -DCMAKE_BUILD_TYPE=Debug
        -DUSE_EZ_LIBS_TESTING=ON
        -DUSE_CODE_COVERAGE=ON
        -DCOVERAGE_VERBOSE=ON
        -DUSE_EZ_EXPR_PERFOS_GENERATION=ON
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Fetch CI actions
        run: git clone --depth 1 --branch master "https://oauth2:${CHECKOUT_TOKEN}@${GITHUB_SERVER_URL#*://}/${CI_REPO}.git" .ci

      - uses: ./.ci/sonar-prepare
        with:
          cmake_args: ${{ env.EZLIBS_CMAKE_ARGS }}

      # ezlibs-specific: the coverage lane, same sequence as the GitHub workflow
      - name: Coverage
        run: |
          cmake --build build --target forceCover -j"$(nproc)"
          cmake --build build --target forcecover_prep_ezLibs -j"$(nproc)"
          cmake --build build -j"$(nproc)"
          xvfb-run --auto-servernum cmake --build build --target cov_ezLibs -j"$(nproc)"
          # expose the LCOV tracefile under a fixed name for sonar-analyze
          TRACEFILE=$(find build/Tests/ezLibs -type f \( -name '*.info' -o -name '*.lcov' \) | head -n 1)
          echo "Tracefile: ${TRACEFILE:-none}"
          if [ -n "${TRACEFILE}" ]; then
            cp "${TRACEFILE}" build/coverage.info
          fi

      - uses: ./.ci/sonar-lint

      - uses: ./.ci/sonar-analyze
        with:
          branch: ${{ inputs.branch || '' }}
          coverage_report: build/coverage.info